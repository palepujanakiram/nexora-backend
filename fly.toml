# fly.toml app configuration file generated for nexora-backend-icz7mg on 2026-10-28T17:46:18Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'nexora-backend-icz7mg'
primary_region = 'ams'

[build]

[env]
  DATABASE_PATH = '/data/nexora.db'
  DUPLICATE_WINDOW_MINUTES = '15'
  LIVE_TRADING = 'false'
  PORT = '8080'

[[mounts]]
  source = 'nexora_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
