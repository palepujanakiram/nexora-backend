# Fly.io config. Change `app` to a name of your own before `fly launch`.
# Orders must leave from one static IP, so this runs exactly one machine in
# Mumbai with an app-scoped static egress IP (see docs/deploy-fly.md).

app = "nexora-backend-jp"
primary_region = "bom"

[build]

[env]
  PORT = "8080"
  DATABASE_PATH = "/data/nexora.db"
  # Flip to "true" only after paper trading works end to end.
  LIVE_TRADING = "false"
  DUPLICATE_WINDOW_MINUTES = "15"

[[mounts]]
  source = "nexora_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Stay up: a signal shouldn't wait for a cold start.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
