# Fly.io config for the live app (nexora-backend-jp). For your own deployment,
# change `app` to a name of your own before `fly launch`.
# Orders must leave from one static IP, so this runs exactly one machine in
# Singapore (Fly has no Indian region) with an app-scoped static egress IP
# (see docs/deploy-fly.md). DATABASE_URL and the keys are Fly secrets.

app = "nexora-backend-jp"
primary_region = "sin"

[build]

[env]
  PORT = "8080"
  NODE_ENV = "production"
  PUBLIC_URL = "https://nexora-backend-jp.fly.dev"
  # Flip to "true" only after paper trading works end to end.
  LIVE_TRADING = "false"
  BILLING_ENABLED = "false"
  OTP_PROVIDER = "msg91"

[http_service]
  internal_port = 8080
  force_https = true
  # Stay up: a signal shouldn't wait for a cold start.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
